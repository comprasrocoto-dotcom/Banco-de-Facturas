<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de Facturas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--blue:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0;letter-spacing:.5px}
.sp{flex:1}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;color:var(--mut);background:none}
.chip.on{border-color:var(--blue);color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.emisor{font-weight:600;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.total{font-size:20px;font-weight:700;margin-left:auto}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--txt);padding:8px 14px;font-size:13px}
button.p{background:#238636;border-color:#2ea043}
button.s{background:#1f6feb;border-color:#388bfd}
button.d{background:transparent;color:var(--bad);border-color:#5a1d1d}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.st-pool{color:var(--warn);border-color:var(--warn)}
.st-asignada{color:var(--blue);border-color:var(--blue)}
.st-sellada{color:var(--ok);border-color:var(--ok)}
#login{max-width:380px;margin:12vh auto;padding:28px}
input,textarea,select{width:100%;padding:10px;margin:8px 0;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit}
textarea{min-height:80px;resize:vertical}
h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:22px 0 10px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.on{display:flex}
.modal .card{max-width:460px;width:100%}
.err{color:var(--bad);font-size:13px;min-height:18px}
.vacio{text-align:center;color:var(--mut);padding:40px}
</style>
</head>
<body>

<div id="login" class="card">
  <h1>🏦 Banco de Facturas</h1>
  <p class="mut">Entrá con el usuario de tu punto de venta.</p>
  <input id="em" type="email" placeholder="correo">
  <input id="pw" type="password" placeholder="contraseña">
  <button class="p" style="width:100%" onclick="entrar()">Entrar</button>
  <div id="lerr" class="err"></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>🏦 BANCO DE FACTURAS</h1>
    <span id="sede" class="badge"></span>
    <span class="sp"></span>
    <button onclick="salir()">Salir</button>
  </header>
  <div class="wrap">
    <div class="row" style="margin-bottom:14px">
      <button class="chip on" id="t-fac"  onclick="setTipo('factura')">Facturas</button>
      <button class="chip"    id="t-nc"   onclick="setTipo('nota_credito')">Notas crédito</button>
      <span class="sp"></span>
      <select id="fcat" style="width:auto" onchange="pintar()">
        <option value="">Todas las categorías</option>
        <option value="insumos">Insumos</option>
        <option value="empaque">Material de empaque</option>
        <option value="aseo">Aseo</option>
        <option value="loza_utensilios">Loza y utensilios</option>
      </select>
      <input id="q" placeholder="🔎 Nº factura, proveedor o CUFE" style="width:300px;margin:0" oninput="pintar()">
      <button class="s" id="btnsubir" style="display:none" onclick="abrirSubir()">⬆ Subir PDFs</button>
    </div>
    <div class="row" id="barraDescarga" style="margin-bottom:16px;display:none">
      <span class="mut">Descargar selladas del</span>
      <input type="date" id="d1" style="width:auto;margin:0">
      <span class="mut">al</span>
      <input type="date" id="d2" style="width:auto;margin:0">
      <button class="p" onclick="descargarSelladas()">⬇ Descargar ZIP</button>
      <span class="mut" id="resdesc"></span>
    </div>
    <div class="row" style="margin-bottom:16px">
      <button class="chip on" id="v-pool"     onclick="setVista('pool')">Sin asignar</button>
      <button class="chip"    id="v-mias"     onclick="setVista('mias')">Mías</button>
      <button class="chip"    id="v-selladas" onclick="setVista('selladas')">Selladas</button>
      <button class="chip"    id="v-nov"      onclick="setVista('nov')">Con novedad</button>
    </div>
    <div id="lista"></div>
  </div>
</div>

<div id="modal" class="modal"><div class="card">
  <h1>Registrar novedad</h1>
  <p id="mnov" class="mut"></p>
  <select id="motivo">
    <option>No llegó el pedido completo</option>
    <option>Se devolvió algo</option>
    <option>Producto en mal estado</option>
    <option>El precio no coincide</option>
    <option>Factura equivocada</option>
    <option>Otra</option>
  </select>
  <textarea id="txt" placeholder="Contá qué pasó..."></textarea>
  <div class="err" id="merr"></div>
  <div class="row"><span class="sp"></span>
    <button onclick="cerrar()">Cancelar</button>
    <button class="s" onclick="guardarNov()">Guardar novedad</button>
  </div>
</div></div>

<script>
const SB = supabase.createClient("https://egzggxwfyqeihzgpjgmp.supabase.co", "sb_publishable_3rzP6pCef1S5nRzFkG-eHw_-BF73n91");
let usuario=null, perfil=null, facturas=[], novedades=[], sedes=[], tipo="factura", vista="pool", novActual=null;
const $=id=>document.getElementById(id);
const money=n=>"$ "+(n||0).toLocaleString("es-CO",{maximumFractionDigits:0});
const fch=s=>s?new Date(s+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"}):"";

async function init(){
  const {data:{session}}=await SB.auth.getSession();
  if(session) await sesion(session.user);
}
async function sesion(u){
  usuario=u;
  const {data:p}=await SB.from("perfiles").select("nombre,rol,sede_id,sedes(nombre,marca_id,marcas(nombre))").eq("user_id",u.id).single();
  perfil=p||{nombre:u.email,rol:"sede"};
  $("login").style.display="none"; $("app").style.display="block";
  const s=perfil.sedes;
  if(perfil.rol==="admin"||perfil.rol==="pagos"){$("btnsubir").style.display="inline-block";$("barraDescarga").style.display="flex";}
  const {data:ss}=await SB.from("sedes").select("id,nombre,marca_id").order("nombre");
  sedes=ss||[];
  const {data:ms}=await SB.from("marcas").select("id,nombre").order("nombre");
  $("mar").innerHTML=(ms||[]).map(m=>`<option value="${m.id}">${m.nombre}</option>`).join("");
  $("sede").textContent=(s?s.nombre:"—")+(s&&s.marcas?" · "+s.marcas.nombre:"");
  await cargar();
}
async function entrar(){
  $("lerr").textContent="";
  const {data,error}=await SB.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error){$("lerr").textContent="No pudimos entrar: "+error.message;return;}
  await sesion(data.user);
}
async function salir(){await SB.auth.signOut();location.reload();}

async function cargar(){
  const {data:f}=await SB.from("facturas_busqueda").select("*").order("fecha_emision",{ascending:false});
  facturas=f||[];
  const {data:n}=await SB.from("novedades").select("cufe,motivo,texto,created_at");
  novedades=n||[];
  pintar();
}
function setTipo(t){tipo=t;$("t-fac").classList.toggle("on",t=="factura");$("t-nc").classList.toggle("on",t=="nota_credito");pintar();}
function setVista(v){vista=v;["pool","mias","selladas","nov"].forEach(x=>$("v-"+x).classList.toggle("on",x==v));pintar();}
function novDe(c){return novedades.find(n=>n.cufe===c);}

function pintar(){
  const cat=$("fcat").value;
  let l=facturas.filter(f=>f.tipo===tipo&&(!cat||f.categoria===cat));
  if(vista=="pool")     l=l.filter(f=>f.estado=="pool"||f.estado=="asignada");
  if(vista=="mias")     l=l.filter(f=>f.estado=="asignada");
  if(vista=="selladas") l=l.filter(f=>f.estado=="sellada"||f.estado=="pagada");
  if(vista=="nov")      l=l.filter(f=>novDe(f.cufe));
  const q=($("q").value||"").trim().toLowerCase();
  if(q) l=l.filter(f=>((f.numero||"")+" "+(f.prefijo||"")+(f.folio||"")+" "+(f.documento||"")+" "+(f.emisor||"")+" "+(f.cufe||"")+" "+(f.num_ingreso||"")).toLowerCase().includes(q));
  const cont=$("lista");
  if(!l.length){cont.innerHTML='<div class="vacio">No hay documentos acá.</div>';return;}
  cont.innerHTML=l.map(f=>{
    const nv=novDe(f.cufe);
    const st={pool:["Sin asignar","st-pool"],asignada:["Mía · sin sellar","st-asignada"],sellada:["Sellada y aprobada","st-sellada"],pagada:["En pagos","st-sellada"],rechazada:["Rechazada","st-pool"]}[f.estado]||[f.estado,""];
    return `<div class="card">
      <div class="row">
        <div><div class="emisor">${f.emisor||"—"}</div>
          <div class="mut">${f.prefijo||""}${f.folio||""} · ${fch(f.fecha_emision)} · NIT ${f.nit_emisor||"—"}</div></div>
        <div class="total">${money(f.total)}</div>
      </div>
      <div class="row" style="margin-top:12px">
        <span class="badge ${st[1]}">${st[0]}</span>
        <span class="badge">${(f.categoria||"otro").replace("_"," ")}</span>
        ${nv?`<span class="badge st-pool">CON NOVEDAD: ${nv.motivo}</span>`:""}
        ${f.num_ingreso?`<span class="badge st-sellada">Ingreso ERP: ${f.num_ingreso}</span>`:""}
        <span class="sp"></span>
        ${(perfil.rol==="sede"&&f.estado=="pool")?`<button class="s" onclick="tomar('${f.cufe}')">Es mía</button>`:""}
        ${(f.estado==="asignada"&&(perfil.rol==="sede"||perfil.rol==="admin"||perfil.rol==="pagos"))?`<button class="d" onclick="soltar('${f.cufe}')">↩ ${perfil.rol==="sede"?"No es mía":"Devolver al pool"}</button>`:""}
        ${((perfil.rol==="admin"||perfil.rol==="pagos")&&f.estado!=="sellada"&&f.estado!=="pagada")?`<select id="sel_${f.cufe}" style="width:auto;margin:0">${sedes.filter(s=>s.marca_id===f.marca_id).map(s=>`<option value="${s.id}"${f.sede_id===s.id?" selected":""}>${s.nombre}</option>`).join("")}</select><button class="s" onclick="asignar('${f.cufe}')">Asignar</button>`:""}
        ${f.estado=="asignada"?`<button class="p" onclick="sellar('${f.cufe}')">✔ Sellar y aprobar</button>`:""}
        ${f.archivo_pdf?`<button onclick="verPdf('${f.cufe}')">📄 Ver PDF</button>`:""}
        ${f.archivo_pdf_sellado?`<button class="p" onclick="window.open('', '_blank'); verPdfArchivo('${f.archivo_pdf_sellado}')">✅ Ver sellada</button>`:""}
        ${f.archivo_recibo?`<button onclick="verPdfArchivo('${f.archivo_recibo}')">📸 Ver recibo</button>`:""}
        ${((perfil.rol==="admin"||perfil.rol==="pagos")&&f.estado!=="pool")?`<button onclick="pedirIngreso('${f.cufe}')">✎ ${f.num_ingreso?"Nº ingreso":"Poner Nº de ingreso"}</button>`:""}
        ${(f.estado!="pagada")?`<button onclick="abrirNov('${f.cufe}')">Novedad</button>`:""}
      </div>
      ${nv?`<div class="mut" style="margin-top:10px">📝 ${nv.texto||nv.motivo}</div>`:""}
    </div>`;
  }).join("");
}

async function tomar(cufe){
  const {error}=await SB.from("facturas").update({
    estado:"asignada", sede_id:perfil.sede_id, asignada_por:usuario.id, asignada_en:new Date().toISOString()
  }).eq("cufe",cufe);
  if(error){alert("No se pudo: "+error.message);return;}
  await SB.from("historial").insert({cufe,accion:"asignada",a:perfil.sedes?.nombre,usuario:usuario.id});
  await cargar();
}
async function verPdfArchivo(ruta){
  const {data,error}=await SB.storage.from("facturas").createSignedUrl(ruta,300);
  if(error||!data){alert("No pude abrir: "+(error?error.message:"sin enlace"));return;}
  window.open(data.signedUrl,"_blank");
}
async function generarSellado(cufe,recibido,rutaFoto){
  const f=facturas.find(x=>x.cufe===cufe);
  if(!f||!f.archivo_pdf){return;}
  try{
    const {data:sig}=await SB.storage.from("facturas").createSignedUrl(f.archivo_pdf,300);
    if(!sig){return;}
    const bytes=await (await fetch(sig.signedUrl)).arrayBuffer();
    const {PDFDocument, rgb, StandardFonts}=PDFLib;
    const doc=await PDFDocument.load(bytes,{ignoreEncryption:true});
    const bold=await doc.embedFont(StandardFonts.HelveticaBold);
    const reg =await doc.embedFont(StandardFonts.Helvetica);
    const fecha=new Date().toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"});
    const sede=(perfil.sedes&&perfil.sedes.nombre)||"punto de venta";
    recibido=(recibido||"").trim().toUpperCase();
    const num=((f.prefijo||"")+(f.folio||""))||f.cufe.slice(0,10);
    doc.getPages().forEach(pg=>{
      const {width}=pg.getSize();
      const bw=Math.min(390,width*0.66), bh=f.num_ingreso?58:46, x=24, y=22;
      pg.drawRectangle({x, y, width:bw, height:bh, color:rgb(0.94,0.99,0.95), opacity:0.96,
                        borderColor:rgb(0.13,0.53,0.21), borderWidth:1.4});
      pg.drawText("APROBADA  ·  "+sede,{x:x+10,y:y+bh-15,size:11,font:bold,color:rgb(0.08,0.40,0.16)});
      pg.drawText("Factura "+num+"  ·  "+fecha,{x:x+10,y:y+bh-27,size:7.5,font:reg,color:rgb(0.25,0.25,0.25)});
      pg.drawText("Recibido por: "+(recibido||"—"),{x:x+10,y:y+(f.num_ingreso?24:8),size:10,font:bold,color:rgb(0.10,0.10,0.10)});
      if(f.num_ingreso) pg.drawText("Nº de ingreso ERP: "+f.num_ingreso,{x:x+10,y:y+9,size:10,font:bold,color:rgb(0.10,0.10,0.10)});
    });
    if(rutaFoto){
      try{
        const {data:sig2}=await SB.storage.from("facturas").createSignedUrl(rutaFoto,300);
        const bytes2=new Uint8Array(await (await fetch(sig2.signedUrl)).arrayBuffer());
        const esPng = bytes2[0]===0x89 && bytes2[1]===0x50;
        const img = esPng ? await doc.embedPng(bytes2) : await doc.embedJpg(bytes2);
        const pg = doc.addPage([img.width, img.height]);
        pg.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
        const alto=Math.min(40,img.height*0.07);
        pg.drawRectangle({x:0,y:0,width:img.width,height:alto,color:rgb(0.94,0.99,0.95),opacity:0.95});
        pg.drawText("Recibo firmado  ·  "+(recibido||"")+"  ·  Factura "+num+"  ·  "+fecha,
          {x:12,y:alto*0.35,size:Math.min(11,alto*0.30),font:bold,color:rgb(0.08,0.40,0.16)});
      }catch(e){ console.warn("no pude pegar la foto al PDF:",e); }
    }
    const out=await doc.save();
    const path=f.archivo_pdf.split("/")[0]+"/"+f.cufe+"_SELLADA.pdf";
    const up=await SB.storage.from("facturas").upload(path,new Blob([out],{type:"application/pdf"}),{upsert:true});
    if(!up.error){ await SB.from("facturas").update({archivo_pdf_sellado:path}).eq("cufe",cufe); }
  }catch(e){ console.warn("sellado:",e); }
}
async function verPdf(cufe){
  const f=facturas.find(x=>x.cufe===cufe);
  if(!f||!f.archivo_pdf){alert("Esta factura no tiene PDF guardado.");return;}
  const {data,error}=await SB.storage.from("facturas").createSignedUrl(f.archivo_pdf,300);
  if(error||!data){alert("No pude abrir el PDF: "+(error?error.message:"sin enlace"));return;}
  window.open(data.signedUrl,"_blank");
}
async function pedirIngreso(cufe){
  const f=facturas.find(x=>x.cufe===cufe)||{};
  const v=prompt("Número de ingreso del ERP (ej: FC.COCINA5103)\nFacura "+(((f.prefijo||"")+(f.folio||""))||"")+" · "+(f.emisor||""), f.num_ingreso||"");
  if(v===null) return;
  const num=v.trim();
  const {error}=await SB.from("facturas").update({num_ingreso:num||null}).eq("cufe",cufe);
  if(error){alert("No se pudo guardar: "+error.message);return;}
  await SB.from("historial").insert({cufe,accion:"numero de ingreso ERP",detalle:num,usuario:usuario.id});
  if(f.estado==="sellada"||f.estado==="pagada"){ await generarSellado(cufe, f.recibido_por, f.archivo_recibo); }
  await cargar();
}
async function descargarSelladas(){
  const d1=$("d1").value, d2=$("d2").value;
  const res=$("resdesc"); res.textContent="";
  let l=facturas.filter(f=>f.estado==="sellada"||f.estado==="pagada");
  if(d1) l=l.filter(f=>(f.fecha_emision||"")>=d1);
  if(d2) l=l.filter(f=>(f.fecha_emision||"")<=d2);
  l=l.filter(f=>f.archivo_pdf);
  if(!l.length){res.textContent="No hay selladas en ese rango.";return;}
  res.textContent="Preparando "+l.length+" PDF(s)...";
  const zip=new JSZip(); let ok=0;
  for(const f of l){
    const {data:sig}=await SB.storage.from("facturas").createSignedUrl(f.archivo_pdf_sellado||f.archivo_pdf,120);
    if(!sig){continue;}
    const r=await fetch(sig.signedUrl); if(!r.ok) continue;
    const blob=await r.blob();
    const num=((f.prefijo||"")+(f.folio||""))||f.cufe.slice(0,12);
    const em=(f.emisor||"proveedor").replace(/[^\w\s\-]/g,"").trim().split("\s+").slice(0,3).join("_");
    zip.file(num+"_"+em+".pdf", blob); ok++;
  }
  if(!ok){res.textContent="No pude descargar los PDFs.";return;}
  const out=await zip.generateAsync({type:"blob"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(out);
  a.download="facturas_selladas_"+(d1||"inicio")+"_a_"+(d2||"hoy")+".zip";
  document.body.appendChild(a); a.click(); a.remove();
  res.textContent="✅ "+ok+" PDF(s) en el ZIP.";
}
async function soltar(cufe){
  if(!confirm("¿Devolver esta factura a \"Sin asignar\" para que la tome la sede correcta?"))return;
  const {error}=await SB.from("facturas").update({
    estado:"pool", sede_id:null, asignada_por:null, asignada_en:null
  }).eq("cufe",cufe);
  if(error){alert("No se pudo devolver: "+error.message);return;}
  await SB.from("historial").insert({cufe,accion:"devuelta al pool",a:perfil.sedes?.nombre||perfil.rol,usuario:usuario.id});
  await cargar();
}
async function asignar(cufe){
  const sel=$("sel_"+cufe); if(!sel)return;
  const sid=Number(sel.value);
  const {error}=await SB.from("facturas").update({
    estado:"asignada", sede_id:sid, asignada_por:usuario.id, asignada_en:new Date().toISOString()
  }).eq("cufe",cufe);
  if(error){alert("No se pudo asignar: "+error.message);return;}
  await SB.from("historial").insert({cufe,accion:"asignada por admin",usuario:usuario.id});
  await cargar();
}
let selloActual=null;
function sellar(cufe){
  selloActual=cufe;
  const f=facturas.find(x=>x.cufe===cufe)||{};
  $("msello").textContent=(f.emisor||"")+"  ·  "+(((f.prefijo||"")+(f.folio||""))||"")+"  ·  "+money(f.total);
  $("recibe").value=""; $("serr").textContent="";
  $("modalSello").classList.add("on");
}
function cerrarSello(){$("modalSello").classList.remove("on");}
async function confirmarSello(){
  const nombre=$("recibe").value.trim();
  if(nombre.length<3){$("serr").textContent="Escribí el nombre de quien recibe la factura.";return;}
  const cufe=selloActual;
  let rutaFoto=null;
  const arch=$("fotoRecibo").files[0];
  if(arch){
    const ext=(arch.name.split(".").pop()||"jpg").toLowerCase();
    rutaFoto=(perfil.sedes?perfil.sedes.nombre:"varios")+"/"+cufe+"_RECIBO."+ext;
    const up=await SB.storage.from("facturas").upload(rutaFoto,arch,{upsert:true});
    if(up.error){$("serr").textContent="No pude subir la foto: "+up.error.message;return;}
  }
  const {error}=await SB.from("facturas").update({
    estado:"sellada", sellada_por:usuario.id, sellada_en:new Date().toISOString(), recibido_por:nombre,
    archivo_recibo:rutaFoto
  }).eq("cufe",cufe);
  if(error){$("serr").textContent="No se pudo sellar: "+error.message;return;}
  await SB.from("historial").insert({cufe,accion:"sellada",a:perfil.sedes?.nombre,detalle:"Recibido por "+nombre,usuario:usuario.id});
  cerrarSello();
  $("resdesc").textContent="Generando el PDF sellado...";
  await generarSellado(cufe,nombre,rutaFoto);
  await cargar();
  $("resdesc").textContent="";
}
function abrirNov(cufe){
  novActual=cufe;
  const f=facturas.find(x=>x.cufe===cufe);
  $("mnov").textContent=(f.emisor||"")+" · "+money(f.total);
  $("txt").value="";$("merr").textContent="";
  $("modal").classList.add("on");
}
function cerrar(){$("modal").classList.remove("on");}
async function guardarNov(){
  const t=$("txt").value.trim();
  if(!t){$("merr").textContent="Escribí qué pasó.";return;}
  const {error}=await SB.from("novedades").insert({
    cufe:novActual,motivo:$("motivo").value,texto:t,sede_id:perfil.sede_id,usuario:usuario.id});
  if(error){$("merr").textContent="No se pudo: "+error.message;return;}
  cerrar(); await cargar();
}
</script>
<div id="modalSello" class="modal"><div class="card">
  <h1>✔ Sellar y aprobar</h1>
  <p class="mut" id="msello"></p>
  <label class="mut">Nombre de quien recibe la factura</label>
  <input id="recibe" placeholder="Ej: JUAN PÉREZ" autocomplete="off">
  <label class="mut">📸 Foto del papelito firmado <span style="opacity:.7">(opcional — en el celular abre la cámara)</span></label>
  <input type="file" id="fotoRecibo" accept="image/*" capture="environment">
  <div class="err" id="serr"></div>

</div></div>

<div id="modal2" class="modal"><div class="card">
  <h1>⬆ Subir facturas (solo PDF)</h1>
  <p class="mut">Del <b>nombre del archivo</b> saco la clave (CUFE); del contenido, los datos. Si algo sale mal, lo corregís después.</p>
  <label class="mut">Marca / empresa</label><select id="mar"></select>
  <label class="mut">Tipo</label><select id="tipo2"><option value="factura">Factura</option><option value="nota_credito">Nota crédito</option></select>
  <label class="mut">Categoría</label><select id="cat2">
    <option value="insumos">Insumos</option><option value="empaque">Material de empaque</option>
    <option value="aseo">Aseo</option><option value="loza_utensilios">Loza y utensilios</option>
    <option value="otro">Otra (no se muestra)</option></select>
  <input type="file" id="files" accept="application/pdf,.pdf" multiple onchange="elegir(event)">
  <div id="res" class="mut"></div>
  <div class="row"><span class="sp"></span>
    <button onclick="cerrarSubir()">Cerrar</button>
    <button class="p" onclick="subirPdfs()">Subir a Supabase</button>
  </div>
</div></div>
<script>
let archivos=[];
function abrirSubir(){$("modal2").classList.add("on");$("res").innerHTML="";archivos=[];}
function cerrarSubir(){$("modal2").classList.remove("on");}
function elegir(ev){
  const todos=[...ev.target.files];
  archivos=todos.filter(f=>f.name.toLowerCase().endsWith(".pdf")||f.type==="application/pdf");
  const n=archivos.length;
  $("res").innerHTML=(n?"📄 "+n+" PDF listo(s): ":"")+archivos.map(f=>f.name).join(" · ")
    +(todos.length!==n?"<br>⚠️ "+ (todos.length-n)+" archivo(s) NO eran PDF y los ignoré":"");
}
async function textoPdf(f){
  const buf=await f.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let t="";
  for(let i=1;i<=Math.min(doc.numPages,4);i++){
    const pg=await doc.getPage(i); const c=await pg.getTextContent();
    t+=c.items.map(x=>x.str).join(" ")+"\n";
  }
  return t;
}
async function datosDePdf(f){
  const t=await textoPdf(f);
  const num=t.match(/([A-Z]{2,4})\s*-?\s*(\d{4,})/)||[];
  const nits=t.match(/NIT[^\d]{0,12}([\d\.]{9,15})/)||[];
  const fecIso=(t.match(/(\d{4}-\d{2}-\d{2})/)||[])[1];
  const fecCo=(t.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/)||[]);
  const tot=(t.match(/(?:TOTAL|Total a pagar)[^\d]{0,25}([\d\.,]{5,})/)||[])[1];
  const em=(t.match(/(?:Raz[oó]n\s*Social|Nombre o raz[oó]n social)[^\n]{0,8}([^\n]{5,60})/i)||[])[1];
  return {
    prefijo:num[1]||null, folio:num[2]||null, documento:((num[1]||"")+(num[2]||""))||null,
    nit:nits[1]?nits[1].replace(/\./g,""):null,
    fecha:fecIso||(fecCo.length?[fecCo[3],fecCo[2].padStart(2,"0"),fecCo[1].padStart(2,"0")].join("-"):null),
    total:tot?Number(tot.replace(/\./g,"").replace(",","."))||null:null,
    emisor:em?em.trim():null
  };
}
async function subirPdfs(){
  if(!archivos.length){$("res").innerHTML="⚠️ Elegí primero los PDF.";return;}
  const marca=Number($("mar").value), tipo=$("tipo2").value, categoria=$("cat2").value;
  const marcas={}; document.querySelectorAll("#mar option").forEach(o=>marcas[o.value]=o.textContent);
  let ok=0; const errs=[];
  $("res").innerHTML="⏳ Procesando "+archivos.length+" archivo(s)...";
  for(const f of archivos){
    try{
      let cufe=(f.name.match(/[0-9a-fA-F]{96}/)||[])[0];
      let d={};
      if(!cufe){ d=await datosDePdf(f); const t=await textoPdf(f); cufe=(t.match(/[0-9a-f]{96}/i)||[])[0]; }
      if(!cufe){ errs.push(f.name+": no encontré el CUFE"); continue; }
      cufe=cufe.toLowerCase();
      const path=(marcas[marca]||"sin-marca")+"/"+cufe+".pdf";
      const up=await SB.storage.from("facturas").upload(path,f,{upsert:true});
      if(up.error) throw new Error(up.error.message);
      if(Object.keys(d).length===0) d=await datosDePdf(f);
      const ins=await SB.from("facturas").insert({
        cufe:cufe, marca_id:marca, tipo:tipo, categoria:categoria,
        prefijo:d.prefijo, folio:d.folio, documento:d.documento, emisor:d.emisor,
        nit_emisor:d.nit, fecha_emision:d.fecha, total:d.total,
        estado:"pool", archivo_pdf:path});
      if(ins.error) throw new Error(ins.error.message);
      ok++;
    }catch(e){ errs.push(f.name+": "+e.message); }
  }
  $("res").innerHTML="✅ "+ok+" de "+archivos.length+" subida(s) y guardada(s) como pendientes (pool)."
    +(errs.length?"<br>⚠️ "+errs.join("<br>"):"");
  archivos=[];
  await cargar();
}
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
SB.auth.onAuthStateChange((_e,s)=>{if(!s){$("login").style.display="block";$("app").style.display="none";}});
init();
</script>
