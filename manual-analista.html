<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Manual del Analista · Banco de Facturas</title><style>
:root{--nar:#C2410C;--osc:#3B1F14;--gris:#475569;--tin:#FFF1EB;--linea:#e5e7eb}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#1f2937;background:#faf7f5;line-height:1.55;font-size:16px}
a{color:var(--nar)}
.barra{position:sticky;top:0;z-index:20;background:var(--osc);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.barra b{margin-right:8px}.barra a{color:#fff;text-decoration:none;background:#5B3A2C;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.barra a.on{background:var(--nar)}.barra .sp{flex:1}.barra a.volver{background:transparent;border:1px solid #8b6b5c}#tabs{display:flex;flex-wrap:wrap;gap:8px}
main{max-width:980px;margin:0 auto;padding:16px}
.aviso{background:#fff;border:1px solid #f5cdb8;border-radius:12px;padding:18px;margin:24px 0;font-size:17px}
.hero{background:var(--osc);color:#fff;border-radius:14px;padding:26px 22px;margin:8px 0 16px}
.hero .pill{display:inline-block;background:var(--nar);border-radius:999px;padding:3px 14px;font-weight:700;font-size:13px;margin-bottom:10px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px);line-height:1.1}.hero p{margin:0;color:#f3e3d8;max-width:760px}.hero small{display:block;margin-top:12px;color:#d6c4bb}
nav.indice{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 16px;margin:0 0 16px}
nav.indice b{display:block;margin-bottom:6px}nav.indice a{display:inline-block;margin:3px 10px 3px 0;font-weight:600;text-decoration:none}
section{margin:22px 0}h2{font-size:22px;color:#fff;background:var(--nar);padding:8px 14px;border-radius:8px;margin:0 0 12px;scroll-margin-top:70px}
h3{font-size:17px;color:var(--nar);margin:14px 0 6px}
.info{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px;margin:10px 0;overflow-x:auto}.info svg{min-width:640px}
.paso{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin:12px 0}
.paso .cab{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.paso .num{background:var(--osc);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.paso .tit{font-size:18px;font-weight:700}.paso .donde{margin-left:auto;font-size:13px;color:#fff;background:var(--gris);border-radius:999px;padding:3px 12px}
.figuras figure{margin:12px 0}.figuras img{width:100%;height:auto;border:1px solid #d1d5db;border-radius:10px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.08)}.figuras figcaption{font-size:14px;color:var(--gris);margin-top:4px}
.paso ol{margin:6px 0 8px 22px;padding:0}.paso li{margin:4px 0}
.ver,.cuid{border-radius:8px;padding:8px 12px;margin:8px 0;font-size:15px}.ver{background:#ECFDF3;border:1px solid #86EFAC}.cuid{background:#FFF7E6;border:1px solid #FBBF24}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #d1d5db;padding:7px 10px;text-align:left;vertical-align:top;font-size:15px}th{background:var(--tin)}
.tabla{overflow-x:auto}
details{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--nar);border-radius:8px;padding:8px 14px;margin:8px 0}summary{cursor:pointer;font-weight:600;color:var(--osc)}details p{margin:8px 0 2px}
.regla{display:flex;gap:12px;margin:8px 0}.regla .n{background:var(--nar);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.mod{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px 14px}.mod ul{margin:6px 0 6px 18px;padding:0;font-size:14.5px}
.sol{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px 16px;margin:10px 0}.sol h4{margin:0 0 6px;color:var(--osc)}.sol .id{background:var(--nar);color:#fff;border-radius:5px;padding:0 8px;margin-right:8px;font-size:13px}
.ayuda{background:var(--tin);border:1px solid #f5cdb8;border-radius:10px;padding:10px 14px;margin:14px 0}
footer{color:var(--gris);font-size:13px;text-align:center;padding:24px 0}
@media (max-width:640px){.barra{position:static}h2{font-size:19px}.paso .donde{margin-left:0}}
@media print{.barra,nav.indice{display:none}body{background:#fff}details{break-inside:avoid}details:not([open])>*:not(summary){display:block}}
</style></head><body>
<div class="barra"><b>🏦 Banco de Facturas · Manual</b><span id="tabs"></span><span class="sp"></span><a class="volver" href="/">← Volver a la web</a></div>
<main id="app"><div class="aviso">Cargando el manual…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  var SLUG = "analista";
  var NOMBRES = {"sede":"🏪 Sede","analista":"📊 Analista","admin":"🛠️ Administrador"};
  var app = document.getElementById('app'), tabs = document.getElementById('tabs');
  function aviso(h) { app.innerHTML = '<div class="aviso">' + h + '</div>'; }
  var SB = supabase.createClient("https://egzggxwfyqeihzgpjgmp.supabase.co", "sb_publishable_3rzP6pCef1S5nRzFkG-eHw_-BF73n91");
  SB.auth.getSession().then(function (r) {
    if (!r.data || !r.data.session) { aviso('Para ver el manual, entra primero a la <a href="/">web</a> con tu usuario y ábrelo desde el botón <b>📖 Manual</b>.'); return; }
    return SB.from('manual_pagina').select('slug,titulo').then(function (q) {
      if (q.error) { aviso('No se pudo cargar el manual. Inténtalo de nuevo o avisa al administrador.'); return; }
      var permitidos = (q.data || []).map(function (x) { return x.slug; });
      ['sede', 'analista', 'admin'].filter(function (s) { return permitidos.indexOf(s) >= 0; }).forEach(function (s) {
        var a = document.createElement('a'); a.href = '/manual-' + s; a.textContent = NOMBRES[s];
        if (s === SLUG) { a.className = 'on'; a.setAttribute('aria-current', 'page'); } tabs.appendChild(a);
      });
      if (!permitidos.length) { aviso('Tu perfil no tiene ningún manual habilitado. Pídele al administrador que te lo active.'); return; }
      if (permitidos.indexOf(SLUG) < 0) { aviso('Tu perfil no tiene habilitado este manual. Puedes ver: ' + permitidos.map(function (s) { return '<a href="/manual-' + s + '">' + NOMBRES[s] + '</a>'; }).join(' · ') + '.'); return; }
      return SB.from('manual_pagina').select('titulo,html').eq('slug', SLUG).maybeSingle().then(function (m) {
        if (m.error || !m.data) { aviso('El manual todavía no está cargado. Avisa al administrador.'); return; }
        document.title = m.data.titulo + ' · Banco de Facturas'; app.innerHTML = m.data.html;
        if (location.hash) { var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
      });
    });
  }).catch(function () { aviso('No se pudo cargar el manual. Revisa tu conexión e inténtalo de nuevo.'); });
})();
</script>
</body></html>
